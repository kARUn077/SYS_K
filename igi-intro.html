<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SYS_K - Tactical Ops</title>
<link rel="icon" href="logo.svg" type="image/svg+xml">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

:root{
    --neon:#00ff66;
    --dark1:#000a03;
    --dark2:#011407;
}

body{
    min-height:100vh;
    overflow:hidden;
    color:var(--neon);
    font-family:'Share Tech Mono', monospace;
    display:flex;
    align-items:center;
    justify-content:center;
    position:relative;
    background:#000a03;
}

/* BACKGROUND: only the soldier is cut out of the title-screen picture (the rest of that
   picture is a mock menu, which used to show through as ghost text behind the real one) */
.bg-soldier{
    --H:min(46vh, 380px);
    position:fixed;
    left:calc(50% - 540px);
    top:3.4rem;
    height:var(--H);
    width:calc(var(--H) * 280 / 290);
    background-image:url('ChatGPT Image Mar 1, 2026, 11_41_24 PM.png');
    background-repeat:no-repeat;
    background-size:calc(var(--H) * 1536 / 290) auto;
    background-position:calc(var(--H) * -310 / 290) calc(var(--H) * -55 / 290);
    filter:brightness(1.15) saturate(1.25) contrast(1.05);
    -webkit-mask-image:radial-gradient(ellipse at 50% 50%, #000 36%, transparent 68%);
    mask-image:radial-gradient(ellipse at 50% 50%, #000 36%, transparent 68%);
    z-index:1;
    pointer-events:none;
}
@media (max-width:1299px){ .bg-soldier{ display:none; } }

/* GRID */
body::before{
    content:"";
    position:fixed;
    inset:0;
    background-image:
        linear-gradient(rgba(0,255,102,0.06) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,255,102,0.06) 1px, transparent 1px);
    background-size:44px 44px;
    animation:gridMove 18s linear infinite;
    pointer-events:none;
}

@keyframes gridMove{
    from{transform:translateY(0);}
    to{transform:translateY(44px);}
}

/* SCANLINE */
.scanline{
    position:fixed;
    width:100%;
    height:2px;
    background:linear-gradient(90deg,transparent,rgba(0,255,102,0.9),transparent);
    box-shadow:0 0 15px rgba(0,255,102,0.9);
    animation:scan 5s linear infinite;
    pointer-events:none;
}

@keyframes scan{
    from{top:-4px;}
    to{top:100%;}
}

/* MAIN WRAP */
.intro-wrap{
    width:min(92vw,720px);
    position:relative;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    gap:2rem;
}

/* HEADER */
.header{
    text-align:center;
    animation: fadeInUp 0.8s ease-out forwards;
    opacity:0;
}

.header h1{
    font-family:'Orbitron',sans-serif;
    font-size:clamp(2.6rem,8vw,4.4rem);
    letter-spacing:0.35rem;
    color:#c8ffd8;
    text-shadow:
        0 0 12px rgba(0,255,102,0.8),
        0 0 30px rgba(0,255,102,0.4);
}

.header h2{
    margin-top:0.4rem;
    font-size:1.1rem;
    letter-spacing:0.12rem;
    opacity:0.9;
}

.version{
    font-size:0.8rem;
    opacity:0.65;
}

/* MENU */
.menu-box{
    width:100%;
    padding:1.8rem;
    border:1.5px solid rgba(0,255,102,0.7);
    background:rgba(0,25,10,0.5);
    backdrop-filter:blur(6px);
    box-shadow:
        0 0 25px rgba(0,255,102,0.25),
        inset 0 0 20px rgba(0,255,102,0.15);    position:relative;
}

/* HUD CORNER BRACKETS */
.menu-box::before,
.menu-box::after{
    content:"";
    position:absolute;
    width:35px;
    height:35px;
    border:2px solid var(--neon);
}

.menu-box::before{
    top:-1px;
    left:-1px;
    border-right:none;
    border-bottom:none;
    box-shadow:-3px -3px 12px rgba(0,255,102,0.4);
}

.menu-box::after{
    bottom:-1px;
    right:-1px;
    border-left:none;
    border-top:none;
    box-shadow:3px 3px 12px rgba(0,255,102,0.4);}

.menu-box h3{
    text-align:center;
    margin-bottom:1.2rem;
    font-family:'Orbitron', sans-serif;
    letter-spacing:0.15rem;
    font-weight:700;
    font-size:1.25rem;
}

.menu-list{
    display:flex;
    flex-direction:column;
    gap:0.8rem;
}

.menu-item{
    border:1px solid rgba(0,255,102,0.6);
    padding:0.85rem 1.2rem;
    background:rgba(0,255,102,0.05);
    text-decoration:none;
    color:var(--neon);
    transition:all 0.25s ease;
    font-family:'Orbitron', sans-serif;
    letter-spacing:0.08rem;
    font-size:1.15rem;
    font-weight:700;
}

.menu-item:hover{
    background:rgba(0,255,102,0.9);
    color:#001106;
    box-shadow:0 0 18px rgba(0,255,102,0.7);
    transform:translateX(6px);
}

.menu-btn{
    cursor:pointer;
}

/* FOOTER */
.menu-box h3{
    animation: fadeInUp 0.8s ease-out 0.5s forwards;
    opacity:0;
}

/* TACTICAL CLOCK */
.tactical-clock{
    position:fixed;
    top:20px;
    right:20px;
    font-family:'Share Tech Mono', monospace;
    font-size:0.95rem;
    color:var(--neon);
    border:1px solid rgba(0,255,102,0.4);
    padding:8px 14px;
    background:rgba(0,25,10,0.6);
    box-shadow:0 0 12px rgba(0,255,102,0.25);
    z-index:3;
    letter-spacing:0.05rem;
}

.menu-list{
    animation: fadeInUp 0.8s ease-out 0.8s forwards;
    opacity:0;
}

footer{
    position:fixed;
    bottom:16px;
    left:50%;
    transform:translateX(-50%);
    font-size:0.75rem;
    opacity:0;
    animation: fadeIn 0.6s ease-out 1.3s forwards;
}

/* ANIMATIONS */
@keyframes fadeInUp{
    from{
        opacity:0;
        transform:translateY(25px);
    }
    to{
        opacity:1;
        transform:translateY(0);
    }
}

@keyframes fadeIn{
    from{opacity:0;}
    to{opacity:0.6;}
}

/* TACTICAL RADAR */
.tactical-radar{
    position:fixed;
    top:15px;
    left:15px;
    width:140px;
    height:140px;
    border:3px solid var(--neon);
    border-radius:50%;
    background:radial-gradient(circle at center, rgba(0,255,102,0.1) 0%, rgba(0,255,102,0.03) 100%);
    box-shadow:0 0 25px rgba(0,255,102,0.4), inset 0 0 20px rgba(0,255,102,0.15);
    z-index:50;
    overflow:hidden;
}

.radar-grid{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
}

/* Crosshair in center */
.radar-grid::before,
.radar-grid::after{
    content:"";
    position:absolute;
    background:var(--neon);
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
}

.radar-grid::before{
    width:2px;
    height:40px;
}

.radar-grid::after{
    width:40px;
    height:2px;
}

.radar-circle{
    position:absolute;
    border:1px solid rgba(0,255,102,0.4);
    border-radius:50%;
    top:50%;
    left:50%;
    transform:translate(-50%, -50%);
}

.radar-circle:nth-child(1){width:30px; height:30px; border-style:dashed;}
.radar-circle:nth-child(2){width:60px; height:60px;}
.radar-circle:nth-child(3){width:90px; height:90px; border-style:dotted;}
.radar-circle:nth-child(4){width:120px; height:120px;}

.radar-scan{
    position:absolute;
    width:100%;
    height:100%;
    top:0;
    left:0;
    background:conic-gradient(from 0deg, transparent 0deg, rgba(0,255,102,0.5) 15deg, transparent 30deg);
    animation:radarSpin 4s linear infinite;
    border-radius:50%;
}

.radar-dot{
    position:absolute;
    width:5px;
    height:5px;
    background:var(--neon);
    border-radius:50%;
    box-shadow:0 0 10px var(--neon), 0 0 20px rgba(0,255,102,0.5);
    animation:radarBlink 1.2s ease-in-out infinite;
}

.radar-dot:nth-child(5){
    top:38%;
    left:58%;
}

.radar-dot:nth-child(6){
    top:62%;
    left:45%;
    animation-delay:0.3s;
}

.radar-dot:nth-child(7){
    top:45%;
    left:70%;
    animation-delay:0.6s;
}

.radar-dot:nth-child(8){
    top:72%;
    left:65%;
    animation-delay:0.15s;
}

.radar-dot:nth-child(9){
    top:28%;
    left:32%;
    animation-delay:0.45s;
}

.radar-dot:nth-child(10){
    top:55%;
    left:78%;
    animation-delay:0.9s;
}

@keyframes radarSpin{
    from{transform:rotate(0deg);}
    to{transform:rotate(360deg);}
}

@keyframes radarBlink{
    0%, 100%{opacity:1; transform:scale(1);}
    50%{opacity:0.2; transform:scale(0.7);}
}

/* CROSSHAIR */
.cursor-crosshair{
    position:fixed;
    top:0;
    left:0;
    width:30px;
    height:30px;
    border:1px solid var(--neon);
    border-radius:50%;
    pointer-events:none;
    transform:translate(-50%, -50%);
    z-index:10000;
    transition: width 0.1s, height 0.1s, border-color 0.1s;
}

body{ cursor:none; }

a, button, .menu-item, .menu-btn, .nv-toggle{ cursor:none !important; }

.cursor-crosshair::before,
.cursor-crosshair::after{
    content:"";
    position:absolute;
    background:var(--neon);
}

.cursor-crosshair::before{
    top:50%;
    left:-5px;
    right:-5px;
    height:1px;
    transform:translateY(-50%);
}

.cursor-crosshair::after{
    left:50%;
    top:-5px;
    bottom:-5px;
    width:1px;
    transform:translateX(-50%);
    transition: background 0.12s ease;
}

body.hover-target .cursor-crosshair{
    width:40px;
    height:40px;
    border-color:#ff2a2a;
}

body.hover-target .cursor-crosshair::before,
body.hover-target .cursor-crosshair::after{
    background:#ff2a2a;
}

/* NIGHT VISION OVERLAY */
.nv-overlay{
    position:fixed;
    inset:0;
    background:radial-gradient(circle at center, rgba(0,255,102,0.3) 0%, rgba(0,255,102,0.15) 50%, rgba(0,10,3,0.8) 100%);
    opacity:0;
    pointer-events:none;
    z-index:60;
    transition:opacity 0.3s ease;
}

body.night-vision .nv-overlay{
    opacity:1;
}

body.night-vision .nv-overlay::before{
    content:"";
    position:absolute;
    inset:0;
    background:repeating-linear-gradient(0deg, rgba(0,0,0,0.15) 0px, rgba(0,0,0,0.15) 1px, transparent 1px, transparent 2px);
    animation:nvFlicker 0.15s infinite;
    pointer-events:none;
}

@keyframes nvFlicker{
    0%, 19%, 21%, 23%, 25%, 54%, 56%, 100%{opacity:1;}
    20%, 24%, 55%{opacity:0.5;}
}

.nv-toggle{
    position:fixed;
    bottom:80px;
    right:20px;
    padding:8px 12px;
    background:rgba(0,255,102,0.1);
    border:1px solid rgba(0,255,102,0.5);
    color:var(--neon);
    font-family:'Share Tech Mono', monospace;
    font-size:0.75rem;
    cursor:pointer;
    z-index:50;
    transition:all 0.25s ease;
    letter-spacing:0.05rem;
}

.nv-toggle:hover{
    background:rgba(0,255,102,0.25);
    box-shadow:0 0 12px rgba(0,255,102,0.4);
}

.nv-toggle.active{
    background:rgba(0,255,102,0.3);
    box-shadow:0 0 15px rgba(0,255,102,0.6);
    border-color:var(--neon);
}

@media(max-width:540px){
    .cursor-crosshair{display:none;}
    body{cursor:auto;}
}

/* crosshair only after a real mouse moves; never on touch screens */
.cursor-crosshair{opacity:0;}
body.has-mouse .cursor-crosshair{opacity:1;}
@media (hover:none), (pointer:coarse){ .cursor-crosshair{display:none;} body{cursor:auto;} }

/* the tool buttons share a row under the menu on small / short screens */
.intro-tools{display:none;}

/* ---- phones and short (landscape) screens: nothing fixed on top of the menu ---- */
@media (max-width:700px), (max-height:640px){
    body{overflow-y:auto; flex-direction:column; align-items:center; justify-content:flex-start; padding:4.2rem 0 1.5rem;}
    .intro-wrap{gap:1.2rem; padding-bottom:.5rem;}
    .tactical-radar{display:none;}
    footer{position:static; transform:none; margin:1.2rem auto 0; padding:0 1rem; text-align:center; opacity:.6; animation:none;}
    .intro-tools{display:flex; gap:.6rem; justify-content:center; flex-wrap:wrap;}
    .intro-tools button{position:static !important; bottom:auto !important; right:auto !important; margin:0 !important; min-height:40px;}
    .header h1{font-size:clamp(2.2rem, 12vw, 3.4rem); letter-spacing:.2rem;}
    .menu-box{padding:1.2rem;}
    .menu-item{font-size:1rem; padding:.8rem 1rem;}
}

/* =====================================================================
   IGI HUD LAYER (title screen)
   ===================================================================== */
.hud-lattice{
    position:fixed; inset:0; z-index:1; pointer-events:none; opacity:.6;
    background:
        repeating-linear-gradient(32deg, rgba(0,255,102,.08) 0 1px, transparent 1px 96px),
        repeating-linear-gradient(-32deg, rgba(0,255,102,.08) 0 1px, transparent 1px 96px);
    -webkit-mask-image:radial-gradient(ellipse at center, transparent 28%, #000 100%);
    mask-image:radial-gradient(ellipse at center, transparent 28%, #000 100%);
}
.hud-ruler{
    position:fixed; left:0; right:0; bottom:0; height:14px; z-index:3; pointer-events:none; opacity:.75;
    background:
        repeating-linear-gradient(90deg, rgba(0,255,102,.9) 0 2px, transparent 2px 60px) bottom / 100% 14px no-repeat,
        repeating-linear-gradient(90deg, rgba(0,255,102,.55) 0 1px, transparent 1px 12px) bottom / 100% 7px no-repeat;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 12%, #000 88%, transparent);
}

/* compass */
.hud-compass{
    position:fixed; top:20px; left:50%; transform:translateX(-50%);
    width:min(520px, calc(100vw - 1000px)); height:46px; z-index:4; pointer-events:none; overflow:hidden;
    -webkit-mask-image:linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
    mask-image:linear-gradient(90deg, transparent, #000 20%, #000 80%, transparent);
}
.hud-compass .strip{ position:absolute; top:16px; left:0; display:flex; will-change:transform; }
.hud-compass .cell{
    flex:0 0 90px; width:90px; text-align:center; position:relative;
    font:700 .85rem 'Orbitron',sans-serif; letter-spacing:.1em; color:#c8ffd8; text-shadow:0 0 8px rgba(0,255,102,.7);
}
.hud-compass .cell::before{ content:""; position:absolute; top:-12px; left:50%; width:2px; height:10px; background:var(--neon); }
.hud-compass .cell::after{
    content:""; position:absolute; top:-7px; left:0; right:0; height:5px;
    background:repeating-linear-gradient(90deg, rgba(0,255,102,.7) 0 1px, transparent 1px 22.5px);
}
.hud-caret{
    position:fixed; top:14px; left:50%; width:0; height:0; z-index:5; pointer-events:none;
    border-left:6px solid transparent; border-right:6px solid transparent; border-top:8px solid #ffd23f;
    transform:translateX(-50%); filter:drop-shadow(0 0 6px rgba(255,210,63,.8));
}
.hud-heading{
    position:fixed; top:64px; left:50%; transform:translateX(-50%); z-index:4; pointer-events:none;
    font-size:.72rem; letter-spacing:.2em; color:#ffd23f; text-shadow:0 0 8px rgba(255,210,63,.6);
}

/* telemetry */
.hud-readout{
    position:fixed; right:2.2vw; top:50%; transform:translateY(-50%); z-index:3; pointer-events:none;
    font-size:.78rem; letter-spacing:.15em; line-height:1.9; text-align:right; opacity:.65;
    border-right:2px solid rgba(0,255,102,.5); padding-right:.7rem;
}
.hud-readout b{ color:#c8ffd8; font-weight:400; }

/* top-right cluster: map, night vision, clock */
.intro-top{ position:fixed; top:20px; right:20px; z-index:6; display:flex; align-items:center; gap:.6rem; }
.intro-top .tactical-clock{ position:static; }
.intro-top .nv-toggle, .intro-top #igiMapBtn{
    position:static !important; bottom:auto !important; right:auto !important; margin:0 !important; white-space:nowrap;
}

/* rotating reticle behind the title */
.header{ position:relative; }
.title-reticle{
    position:absolute; left:50%; top:44%; width:min(300px,70vw); height:min(300px,70vw);
    transform:translate(-50%,-50%); z-index:-1; pointer-events:none; opacity:.55;
}
.title-reticle .spin{ transform-origin:130px 130px; animation:reticleSpin 48s linear infinite; }
@keyframes reticleSpin{ to{ transform:rotate(360deg); } }

/* "turn on the sound" hint: the browser only allows audio after a click / key / tap */
.audio-hint{
    visibility:hidden; text-align:center; font-size:.78rem; letter-spacing:.18em; color:#ffd23f;
    text-shadow:0 0 8px rgba(255,210,63,.6); animation:hintPulse 1.4s ease-in-out infinite;
}
.audio-hint.show{ visibility:visible; }
@keyframes hintPulse{ 0%,100%{ opacity:1; } 50%{ opacity:.35; } }
@media (prefers-reduced-motion:reduce){ .audio-hint{ animation:none; } }

/* selected menu entry (keyboard or mouse), same look as hover */
.menu-item.sel{
    background:rgba(0,255,102,0.9); color:#001106; box-shadow:0 0 18px rgba(0,255,102,0.7); transform:translateX(6px);
}

/* objectives counter (bottom right) */
.hud-bottom{
    position:fixed; left:24px; right:24px; bottom:34px; z-index:4; pointer-events:none;
    display:flex; justify-content:space-between; align-items:flex-end; gap:1rem;
}
.hud-label{
    display:flex; justify-content:space-between; gap:1rem; margin-bottom:.35rem;
    font:700 .68rem 'Orbitron',sans-serif; letter-spacing:.25em; color:#c8ffd8; text-shadow:0 0 6px rgba(0,255,102,.5);
}
.hud-label b{ font-weight:700; color:var(--neon); }
.hud-ammo{ text-align:right; margin-left:auto; }
.play-btn{
    pointer-events:auto; align-self:flex-end; display:inline-flex; align-items:center; gap:.5rem; padding:.7rem 1.1rem;
    font:700 .78rem 'Orbitron',sans-serif; letter-spacing:.14em; text-decoration:none; color:#ffd23f;
    border:1px solid #ffd23f; background:rgba(60,45,0,.45); box-shadow:0 0 14px rgba(255,210,63,.25);
    transition:background .2s, color .2s, box-shadow .2s;
}
.play-btn:hover, .play-btn:focus-visible{ background:#ffd23f; color:#201800; box-shadow:0 0 22px rgba(255,210,63,.7); }
.hud-ammo .hud-label{ justify-content:flex-end; }
.hud-count b{ font:900 1.9rem 'Orbitron',sans-serif; color:#fff; text-shadow:0 0 12px rgba(0,255,102,.7); }
.hud-count span{ font-size:.95rem; opacity:.75; margin-left:.2rem; }

@media (max-width:1199px){ .hud-compass, .hud-caret, .hud-heading{ display:none; } }
@media (max-width:1100px){ .hud-readout{ display:none; } }

/* ---- phones and short screens: the HUD joins the page flow instead of floating over the menu ---- */
@media (max-width:700px), (max-height:640px){
    .hud-ruler, .hud-readout, .hud-compass, .hud-caret, .hud-heading{ display:none; }
    .intro-top{ top:10px; right:10px; }
    .intro-top .tactical-clock{ font-size:.8rem; padding:6px 10px; }
    .hud-bottom{
        position:static; width:min(92vw,720px); margin:1rem auto 0; flex-wrap:wrap; justify-content:space-between;
    }
    .title-reticle{ width:min(220px,60vw); height:min(220px,60vw); }
}
@media (prefers-reduced-motion:reduce){ .title-reticle .spin{ animation:none; } }
</style>
</head>

<body>

<div class="bg-soldier" aria-hidden="true"></div>
<div class="scanline"></div>
<div class="nv-overlay"></div>
<div class="cursor-crosshair"></div>
<div class="hud-lattice"></div>
<div class="hud-ruler"></div>

<!-- compass strip: scrolls with the mouse like turning your head -->
<div class="hud-compass" aria-hidden="true"><div class="strip" id="compassStrip"></div></div>
<div class="hud-caret" aria-hidden="true"></div>
<div class="hud-heading" id="hudHeading" aria-hidden="true">HDG 000&deg; N</div>

<!-- telemetry read-outs (right edge) -->
<div class="hud-readout" aria-hidden="true">
    <div>RNG <b id="roRng">346</b></div>
    <div>ALT <b id="roAlt">404</b></div>
    <div>SPD <b id="roSpd">009</b>M</div>
</div>

<!-- top right: map / night-vision buttons and the clock -->
<div class="intro-top">
    <button class="nv-toggle" id="audioToggle" aria-label="Toggle music">[ AUDIO: OFF ]</button>
    <button class="nv-toggle" id="nvToggle">[ NV MODE ]</button>
    <div class="tactical-clock" id="tacticalClock">00:00:00 UTC</div>
</div>

<!-- Tactical Radar -->
<div class="tactical-radar">
    <div class="radar-grid">
        <div class="radar-circle"></div>
        <div class="radar-circle"></div>
        <div class="radar-circle"></div>
        <div class="radar-circle"></div>
        <div class="radar-dot"></div>
        <div class="radar-dot"></div>
        <div class="radar-dot"></div>
        <div class="radar-dot"></div>
        <div class="radar-dot"></div>
        <div class="radar-dot"></div>
        <div class="radar-scan"></div>
    </div>
</div>

<div class="intro-wrap">

    <div class="header">

<script>
const cursor=document.querySelector('.cursor-crosshair');

// Live tactical clock update
function updateClock(){
    const now = new Date();
    const hours = String(now.getHours()).padStart(2, '0');
    const minutes = String(now.getMinutes()).padStart(2, '0');
    const seconds = String(now.getSeconds()).padStart(2, '0');
    document.getElementById('tacticalClock').textContent = `${hours}:${minutes}:${seconds}`;
}

updateClock();
setInterval(updateClock, 1000);

document.addEventListener('mousemove',e=>{
    document.body.classList.add('has-mouse');
    cursor.style.left=e.clientX+'px';
    cursor.style.top=e.clientY+'px';
});

// Hover sound and cursor effects
document.querySelectorAll('.menu-item, .nv-toggle').forEach(item => {
    item.addEventListener('mouseenter', () => {
        if (window.igiSound) igiSound.play('hover');
        document.body.classList.add('hover-target');
    });
    
    item.addEventListener('mouseleave', () => {
        document.body.classList.remove('hover-target');
    });
    
    item.addEventListener('click', () => {
        if (window.igiSound) igiSound.play('click');
    });
});

function quitMission(){
    window.location.href="https://google.com";
}

// Night Vision Toggle (Global - Persistent)
const nvToggle = document.getElementById('nvToggle');

// Check localStorage on load
if(localStorage.getItem('nightVisionMode') === 'true'){
    document.body.classList.add('night-vision');
    nvToggle.classList.add('active');
}

nvToggle.addEventListener('click', () => {
    document.body.classList.toggle('night-vision');
    nvToggle.classList.toggle('active');
    localStorage.setItem('nightVisionMode', document.body.classList.contains('night-vision'));
});

// Toggle NV with 'N' key
document.addEventListener('keydown', (e) => {
    if(e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if(e.target && /^(INPUT|TEXTAREA|SELECT)$/.test(e.target.tagName)) return;
    if(e.key.toLowerCase() === 'n'){
        document.body.classList.toggle('night-vision');
        nvToggle.classList.toggle('active');
        localStorage.setItem('nightVisionMode', document.body.classList.contains('night-vision'));
    }
});
</script>

<script src="igi-map.js?v=16"></script>
<script>
/* ---------- top-right cluster: map + NV next to the clock (or a row under the menu on small screens) ---------- */
window.addEventListener('load', function () {
    var wrap = document.querySelector('.intro-wrap');
    var top = document.querySelector('.intro-top');
    var clock = document.getElementById('tacticalClock');
    var nv = document.getElementById('nvToggle');
    var map = document.getElementById('igiMapBtn');
    if (!wrap || !top) return;
    var row = document.createElement('div');
    row.className = 'intro-tools';
    wrap.appendChild(row);
    var mq = window.matchMedia('(max-width:700px), (max-height:640px)');
    function place() {
        if (mq.matches) {
            if (map) row.appendChild(map);
            if (nv) row.appendChild(nv);
        } else {
            if (map) top.insertBefore(map, clock);
            if (nv) top.insertBefore(nv, clock);
        }
    }
    place();
    if (mq.addEventListener) mq.addEventListener('change', place); else mq.addListener(place);
});

/* ---------- IGI HUD behaviour ---------- */
(function () {
    var $ = function (id) { return document.getElementById(id); };

    /* compass: heading follows the mouse across the screen (slow drift when there is no mouse) */
    var DIRS = ['N', 'NE', 'E', 'SE', 'S', 'SW', 'W', 'NW'];
    var strip = $('compassStrip'), headEl = $('hudHeading');
    if (strip) {
        for (var i = 0; i < 24; i++) {
            var c = document.createElement('div');
            c.className = 'cell';
            c.textContent = DIRS[i % 8];
            strip.appendChild(c);
        }
        var mouseX = null, deg = 0, last = performance.now();
        document.addEventListener('mousemove', function (e) { mouseX = e.clientX; }, { passive: true });
        (function frame(now) {
            var target = mouseX === null ? (now / 1000 * 6) % 360 : (mouseX / window.innerWidth) * 360;
            deg += (target - deg) * Math.min(1, (now - last) / 220);
            last = now;
            var d = ((deg % 360) + 360) % 360;
            var half = strip.parentNode.clientWidth / 2;
            strip.style.transform = 'translateX(' + (half - (720 + (d / 45) * 90 + 45)) + 'px)';
            var n = Math.round(d / 45) % 8;
            if (headEl) headEl.innerHTML = 'HDG ' + String(Math.round(d) % 360).padStart(3, '0') + '&deg; ' + DIRS[n];
            requestAnimationFrame(frame);
        })(performance.now());
    }

    /* telemetry numbers drift a little */
    var ro = { rng: 346, alt: 404, spd: 9 };
    setInterval(function () {
        ro.rng = Math.max(120, ro.rng + Math.round((Math.random() - 0.5) * 12));
        ro.alt = Math.max(300, ro.alt + Math.round((Math.random() - 0.5) * 6));
        ro.spd = Math.max(0, Math.min(14, ro.spd + Math.round((Math.random() - 0.5) * 2)));
        if ($('roRng')) $('roRng').textContent = String(ro.rng).padStart(3, '0');
        if ($('roAlt')) $('roAlt').textContent = String(ro.alt).padStart(3, '0');
        if ($('roSpd')) $('roSpd').textContent = String(ro.spd).padStart(3, '0');
    }, 900);

    /* objectives counter (written by igi-map.js) */
    setInterval(function () {
        if (typeof window.igiProgress !== 'function') return;
        var p = window.igiProgress();
        $('ammoDone').textContent = String(p[0]).padStart(2, '0');
        $('ammoTotal').textContent = '/' + p[1];
    }, 1000);

    /* background music: starts on its own when the browser allows it, otherwise on the first
       click / key press / tap (browsers do not count scrolling or moving the mouse) */
    var bg = $('sndBgTrack'), abtn = $('audioToggle'), hint = $('audioHint');
    var userOff = localStorage.getItem('tactical_audio_playing') === 'false';
    var gestures = ['pointerdown', 'keydown', 'touchstart'];
    bg.volume = 0.25;
    function audioUi(on) {
        abtn.textContent = on ? '[ AUDIO: ON ]' : '[ AUDIO: OFF ]';
        abtn.classList.toggle('active', on);
    }
    function disarm() { gestures.forEach(function (t) { document.removeEventListener(t, onGesture, true); }); }
    function startMusic() {
        return bg.play().then(function () {
            audioUi(true); hint.classList.remove('show'); disarm();
            localStorage.setItem('tactical_audio_playing', 'true');
        });
    }
    function onGesture(e) {
        if (userOff || abtn.contains(e.target)) return;
        startMusic().catch(function () {});
    }
    abtn.addEventListener('click', function () {
        if (bg.paused) { userOff = false; startMusic().catch(function () {}); }
        else { userOff = true; bg.pause(); audioUi(false); disarm(); localStorage.setItem('tactical_audio_playing', 'false'); }
    });
    audioUi(false);
    if (!userOff) {
        startMusic().catch(function () {
            hint.classList.add('show');
            gestures.forEach(function (t) { document.addEventListener(t, onGesture, true); });
        });
    }

    /* menu: arrow keys + Enter, like the game */
    var items = Array.prototype.slice.call(document.querySelectorAll('.menu-item'));
    var idx = 0;
    function play(kind) { if (window.igiSound) igiSound.play(kind); }
    function select(i, quiet) {
        idx = (i + items.length) % items.length;
        items.forEach(function (it, j) { it.classList.toggle('sel', j === idx); });
        if (!quiet) play('hover');
    }
    items.forEach(function (it, j) {
        it.addEventListener('mouseenter', function () { select(j, true); });
        it.addEventListener('focus', function () { select(j, true); });
    });
    select(0, true);
    document.addEventListener('keydown', function (e) {
        if (e.ctrlKey || e.metaKey || e.altKey) return;
        if (e.key === 'ArrowDown') { e.preventDefault(); select(idx + 1); }
        else if (e.key === 'ArrowUp') { e.preventDefault(); select(idx - 1); }
        else if (e.key === 'Enter' && document.activeElement && document.activeElement.classList.contains('menu-item') === false) {
            e.preventDefault();
            items[idx].click();
        }
    });
})();
</script>
